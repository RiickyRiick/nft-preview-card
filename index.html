<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | NFT preview card component</title>
</head>

<body>

  <main class="portfolio-container">
    <article class="nft-card">

      <div class="img-wrapper">
        <img class="nft-image" src="./images/image-equilibrium.jpg" alt="equilibrium image">
        <img class="view-icon" src="./images/icon-view.svg" alt="icon view">
      </div>

      <div class="cards-details">
        <a class="card-title" href="#">
          <p>Equilibrium #3429</p>
        </a>
        <p class="card-description same-color">Our Equilibrium collection promotes balance and calm.</p>
        <section class="price-timer">
          <div class="price-info">
            <img class="ethereum-icon" src="./images/icon-ethereum.svg" alt="ethereum">
            <p class="eth-text">0.041 ETH</p>
          </div>
          <div class="time-info">
            <img class="timer-icon" src="./images/icon-clock.svg" alt="clock">
            <p class="timer-text same-color">3 days left</p>
          </div>
        </section>
        <section class="creator-info">
          <img class="creator-avatar" src="./images/image-avatar.png" alt="avatar">
          <p><span class="creator-label same-color">Creation of</span> <a class="creator-name" href="#">Jules Wyvern</a></p>
      </div>
      </section>
    </article>
  </main>
  <footer>
    <p class="attribution">
      Challenge by 
      <img src="./images/favicon-32x32.png" alt="icon">
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://www.frontendmentor.io/profile/RiickyRiick" target="_blank">Rodrigo Arroyo-Haro</a>.
    </p>
  </footer>



</body>

</html>
